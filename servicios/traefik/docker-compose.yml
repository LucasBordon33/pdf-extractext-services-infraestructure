services:
  reverse-proxy:
    # v3.7: la serie v3.5 no negocia con el Engine API de Docker 29
    # (GET /version -> 400 sin mensaje) y el docker provider muere en
    # loop de retry sin cargar ningún router.
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/config.yml:/etc/traefik/config.yml:ro
      - ./certs:/etc/certs:ro
    networks:
      - pdf-extractext-network

networks:
  pdf-extractext-network:
    external: true
