services:
  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: agent -client=0.0.0.0
    environment:
      CONSUL_LOCAL_CONFIG: |
        {
         "datacenter" : "dc1",
         "data_dir": "/consul/data",
         "server": true,
         "bootstrap_expect": 1,
         "log_level" : "INFO",
         "connect" : {
           "enabled": false
         },
         "performance": {
          "raft_multiplier": 1
         } 
        }
    ports:
      - "127.0.0.1:8500:8500"
    volumes:
      - consul-data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pdf-extractext-network

volumes:
  consul-data:

networks:
  pdf-extractext-network:
    external: true
