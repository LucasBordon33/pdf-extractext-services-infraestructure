[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "service-discovery"
version = "0.1.0"
description = "Módulo compartido de service discovery (Consul) para los microservicios pdf-extractext"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # Única dependencia real: la configuración viaja por env vars (Twelve-Factor III).
    # El cliente de Consul usa solo stdlib (urllib) para no contaminar
    # los locks de los servicios que venden este paquete.
    "pydantic-settings>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/service_discovery"]

[tool.ruff]
line-length = 100
target-version = "py311"
